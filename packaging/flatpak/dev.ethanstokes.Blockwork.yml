app-id: dev.ethanstokes.Blockwork
# org.gnome.Platform (not org.freedesktop.Platform) for GTK3, which tao/wry needs
# for the window itself. webkit2gtk is unused: the "cef" feature keeps wry from
# ever linking webkit2gtk-sys.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: blockwork
branch: stable

# rust-stable/node20 are declared above via sdk-extensions only (build-time:
# mounted at /usr/lib/sdk/<name> inside the build sandbox, see
# build-options.append-path below) -- deliberately NOT also duplicated here
# via add-extensions, which instead bakes an extension point into the
# *exported app's* own metadata and makes flatpak try to mount them at
# /app/sdk/<name> on every launch. Neither extension is actually installed
# as a runtime-available extension on a user's system, so that mount failed
# outright ("Read-only file system" / "ldconfig failed") and the app never
# started.

# Builds the Rust workspace and pnpm/Vite frontend from source inside the
# sandbox, fully offline, rather than reusing a host-built binary -- a host
# build links against the host's glibc, which can be newer than the runtime's
# on a rolling-release distro and fails to start under `flatpak run`.

build-options:
  # build.rs shells out to bare `pnpm`, so pnpm-bin needs to be on PATH, not just
  # invoked by relative path in build-commands.
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin:/run/build/blockwork/pnpm-bin
  env:
    # cargo-sources.json's vendor config lives at cargo/config, not .cargo/config.toml;
    # cargo only picks it up if CARGO_HOME points there.
    CARGO_HOME: /run/build/blockwork/cargo
    CARGO_NET_OFFLINE: 'true'
    CEF_PATH: /run/build/blockwork/cef-prebuilt
    # Full nproc alongside a from-scratch CEF wrapper cmake/ninja build OOM-kills
    # the sandbox; cap cargo (and, transitively via $NUM_JOBS, ninja) instead.
    CARGO_BUILD_JOBS: '6'
    # Tells build.rs to pass pnpm --offline/--frozen-lockfile/--trust-lockfile --
    # pnpm ignores the env-var equivalents for these, only the CLI flags work.
    # Not named FLATPAK: cef-dll-sys's build script keys off that name to look
    # for CEF at /usr/lib instead of $CEF_PATH.
    BLOCKWORK_PNPM_OFFLINE: '1'

finish-args:
  - --share=ipc
  # No --share=network: nothing in the default "cef" build touches the network.
  # x86_64: the custom CEF build supports Wayland natively, so grant both
  # sockets and let the wrapper script (see below) pick GDK_BACKEND=wayland.
  # aarch64: no Wayland patch exists, so the wrapper forces
  # GDK_BACKEND=x11 instead.  fallback-x11 ensures DISPLAY is always
  # exported so XWayland works when needed.
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio # CEF's Chromium renderer wants audio output access.
  - --device=all # /dev/uinput + /dev/input/event* for evdev hotkeys & synthetic input.
  - --device=dri
  # No --talk-name=org.freedesktop.DBus: CEF's "Failed to connect to the bus" (it
  # wants UPower) is harmless without it.
  # --filesystem=home is for blockwork-core's Command instruction, which shells out
  # via `bash -c` with no path restriction -- not for rfd dialogs (portal-routed,
  # need nothing) or config persistence (XDG dir, auto-redirected).
  - --filesystem=home

modules:
  - name: blockwork
    buildsystem: simple
    build-commands:
      # 1. Stage CEF where cef-dll-sys's build.rs expects it via $CEF_PATH (see
      # download-cef's extract_target_archive()), so it never tries to fetch it.
      # CEF_VERSION must match the "+<version>" build metadata in cef-dll-sys's
      # Cargo.toml version (see download_cef::default_version) -- bump it
      # whenever that changes, alongside the source archives below.
      - |
        set -e
        CEF_VERSION="151.3.24"
        case "$(uname -m)" in
          x86_64)
            # Custom Wayland-patched build from cloud.frozenblock.net (see
            # ../cef-rs/sys/build.rs's DEFAULT_LINUX_X64_ARCHIVE_URL, only used
            # for x86_64-unknown-linux-gnu). Unlike the official minimal
            # distribution below, this archive's single top-level directory is
            # already the complete, flattened cef_dir -- build-time headers/cmake
            # and runtime files together, plus its own valid archive.json -- so
            # it just needs extracting and renaming, no Release/Resources merge.
            DEST="$CEF_PATH/$CEF_VERSION/cef_linux_x86_64"
            mkdir -p "$CEF_PATH/$CEF_VERSION"
            ARCHIVE=cef_binary_wayland_linux64.tar.zst
            EXTRACTED_DIR=$(tar --zstd -tf "$ARCHIVE" | head -1 | cut -d/ -f1)
            tar --zstd -xf "$ARCHIVE"
            mv "$EXTRACTED_DIR" "$DEST"
            ;;
          aarch64)
            # Official upstream CEF minimal distribution -- no Wayland patch
            # exists for aarch64, which is why window_info.rs's
            # set_as_child_wayland is gated to x86_64 only. Split
            # Release/Resources layout, same as x86_64 used to be.
            DEST="$CEF_PATH/$CEF_VERSION/cef_linux_aarch64"
            mkdir -p "$CEF_PATH/$CEF_VERSION"
            ARCHIVE=$(ls cef_binary_*_linuxarm64_minimal.tar.bz2)
            ARCHIVE_NAME=$(basename "$ARCHIVE")
            SHA1=$(sha1sum "$ARCHIVE" | cut -d' ' -f1)
            EXTRACTED_DIR="${ARCHIVE_NAME%.tar.bz2}"
            tar -xjf "$ARCHIVE"
            mv "$EXTRACTED_DIR/Release" "$DEST"
            mv "$EXTRACTED_DIR"/Resources/* "$DEST/"
            mv "$EXTRACTED_DIR/CMakeLists.txt" "$DEST/"
            mv "$EXTRACTED_DIR/cmake" "$DEST/"
            mv "$EXTRACTED_DIR/include" "$DEST/"
            mv "$EXTRACTED_DIR/libcef_dll" "$DEST/"
            mv "$EXTRACTED_DIR/CREDITS.html" "$DEST/"
            rm -rf "$EXTRACTED_DIR"
            printf '{"type":"minimal","name":"%s","sha1":"%s"}' "$ARCHIVE_NAME" "$SHA1" > "$DEST/archive.json"
            ;;
          *) echo "unsupported arch for CEF staging: $(uname -m)" >&2; exit 1 ;;
        esac
      # 2. Stage pnpm (node20 extension has node/npm/corepack but not pnpm, and
      # corepack needs network on first use). Pinned to ui/package.json's
      # packageManager version.
      - mkdir -p pnpm-bin && tar -xzf pnpm-linux-*.tar.gz -C pnpm-bin
      # pnpm ignores npm_config_store_dir and always resolves ./.pnpm-store by
      # walking up from cwd to the nearest pnpm-workspace.yaml (ui/'s own) --
      # so point that at the store node-sources.json populated at the build root.
      - ln -s flatpak-node/pnpm-store .pnpm-store
      # 3. Rust workspace + frontend (via build.rs), vendored via cargo/node-sources.json.
      - cargo --offline build --release
      # 4. Install the binary plus the CEF runtime payload build.rs drops next to
      # it in target/release. RUNPATH is $ORIGIN, so everything lives together in
      # a private libdir, not /usr/bin.
      - install -Dm755 target/release/blockwork /app/lib/blockwork/blockwork
      - mkdir -p /app/bin
      # Wrapper, not a symlink: tauri-runtime-cef's "sandbox" feature is on by
      # default and can't be disabled downstream, which builds a chrome-sandbox
      # expecting root+setuid -- Flatpak's export can't do that. --no-sandbox is
      # the standard workaround (redundant with Flatpak's own bwrap anyway).
      - |
        cat > /app/bin/blockwork <<'EOF'
        #!/bin/sh
        case "$(uname -m)" in
          x86_64)
            if [ -n "${WAYLAND_DISPLAY:-}" ]; then
              export GDK_BACKEND=wayland
            else
              export GDK_BACKEND=x11
            fi
            ;;
          aarch64) export GDK_BACKEND=x11 ;;
        esac
        exec /app/lib/blockwork/blockwork --no-sandbox "$@"
        EOF
        chmod +x /app/bin/blockwork
      - install -Dm755 target/release/libcef.so /app/lib/blockwork/libcef.so
      - install -Dm755 target/release/libEGL.so /app/lib/blockwork/libEGL.so
      - install -Dm755 target/release/libGLESv2.so /app/lib/blockwork/libGLESv2.so
      - install -Dm755 target/release/libvk_swiftshader.so /app/lib/blockwork/libvk_swiftshader.so
      - install -Dm755 target/release/libvulkan.so.1 /app/lib/blockwork/libvulkan.so.1
      - install -Dm644 target/release/vk_swiftshader_icd.json /app/lib/blockwork/vk_swiftshader_icd.json
      - install -Dm755 target/release/chrome-sandbox /app/lib/blockwork/chrome-sandbox
      - install -Dm644 target/release/icudtl.dat /app/lib/blockwork/icudtl.dat
      - install -Dm644 target/release/v8_context_snapshot.bin /app/lib/blockwork/v8_context_snapshot.bin
      - install -Dm644 target/release/chrome_100_percent.pak /app/lib/blockwork/chrome_100_percent.pak
      - install -Dm644 target/release/chrome_200_percent.pak /app/lib/blockwork/chrome_200_percent.pak
      - install -Dm644 target/release/resources.pak /app/lib/blockwork/resources.pak
      - cp -r target/release/locales /app/lib/blockwork/locales
      # 5. Desktop file, icon, AppStream metainfo. Icon= must match the app id
      # for flatpak export, hence the sed rename from res/blockwork.desktop's Icon=blockwork.
      - sed 's/^Icon=blockwork$/Icon=dev.ethanstokes.Blockwork/' res/blockwork.desktop > dev.ethanstokes.Blockwork.desktop
      - install -Dm644 dev.ethanstokes.Blockwork.desktop /app/share/applications/dev.ethanstokes.Blockwork.desktop
      - install -Dm644 res/icons/blockwork.png /app/share/icons/hicolor/256x256/apps/dev.ethanstokes.Blockwork.png
    sources:
      # Local checkout including uncommitted changes, for `just flatpak-build`
      # iteration. Before a real Flathub submission, swap for a pinned `type: git`
      # source -- Flathub requires reproducible sources, not a live working tree.
      - type: dir
        path: ../..
        skip: [target, .git, .flatpak-builder, flatpak-build, flatpak-repo, node_modules, ui/node_modules, ui/dist, packaging/flatpak]

      # Regenerate with `just flatpak-sources` whenever Cargo.lock changes.
      - cargo-sources.json

      # Regenerate with `just flatpak-sources` whenever ui/pnpm-lock.yaml changes.
      # --pnpm-store-version v11 matches pnpm 11.3.0's store layout (the
      # generator's default v10 layout is unreadable by pnpm 11).
      - node-sources.json

      # Standalone pnpm binary, pinned to ui/package.json's packageManager version.
      - type: file
        url: https://github.com/pnpm/pnpm/releases/download/v11.3.0/pnpm-linux-x64.tar.gz
        sha256: 6eb506b53297eb1186ba0cbff1577bb26d17713835a01a5342dcafae550827ce
        only-arches: [x86_64]
      - type: file
        url: https://github.com/pnpm/pnpm/releases/download/v11.3.0/pnpm-linux-arm64.tar.gz
        sha256: 383f644f50667e9c1752791173d274ba414117262b09c1b027c2d297bf520662
        only-arches: [aarch64]

      # Pinned CEF prebuilt runtime matching cef-dll-sys 151.8.0+151.3.24. No
      # source build: Flathub allows a pinned, hash-verified prebuilt binary as a
      # source (as with Electron apps bundling Chromium); what it disallows is
      # fetching it during the sandboxed build, which step 1 above avoids.
      #
      # x86_64: our own Wayland-patched build (chromiumembedded/cef#4233, built
      # from ~/cef-wayland-build), hosted at a personal Nextcloud share -- there
      # is no upstream equivalent. dest-filename is required since the URL
      # itself has no filename/extension for flatpak-builder to infer one from.
      # If this file is ever rebuilt at the same share link, its sha256 (and
      # CEF_VERSION above, if the underlying CEF/Chromium version changes too)
      # must be updated to match.
      - type: file
        url: https://cloud.frozenblock.net/s/82X5EQQ2ZoiPLWs/download
        dest-filename: cef_binary_wayland_linux64.tar.zst
        sha256: 77215ed9b7828c19993518d154e841e8fd41d58138a2385c3f8ec4a0ae6dee16
        only-arches: [x86_64]
      # aarch64: official upstream build, since it doesn't need the Wayland
      # patch (see the build-commands comment above).
      - type: file
        url: https://cef-builds.spotifycdn.com/cef_binary_151.3.24+g2384915+chromium-151.0.7922.174_linuxarm64_minimal.tar.bz2
        sha256: 47965b9c36a5958bdd6d6fdb3fe3360f38d17d65914ef636abade14881cdc59b
        only-arches: [aarch64]
