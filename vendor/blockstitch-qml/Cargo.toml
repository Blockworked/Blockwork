[package]
name = "blockstitch-qml"
version = "0.1.0"
edition = "2024"
description = "Qt 6/QML frontend components for Blockstitch's block canvas"
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
path = "rust/lib.rs"

[dependencies]
cxx-qt = "0.10"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
qt-build-utils = { version = "0.10", features = ["qt_minimal"] }
qt-version = { version = "0.1", features = ["qt_version_at_least_6_10"] }
serde_json = "1"
