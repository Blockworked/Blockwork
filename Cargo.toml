[workspace]
members = [
    "blockwork-qt",
    "blockwork-app",
    "blockwork-core",
    "blockwork-daemon",
    "blockwork-ffi",
    "blockwork-linux-bridge",
    "blockwork-protocol",
]
resolver = "2"

default-members = [
    "blockwork-app",
    "blockwork-qt",
]

[workspace.package]
version = "0.5.4"
edition = "2024"

[workspace.dependencies]
blockstitch-core = {
    #git = "https://github.com/Blockworked/blockstitch",
    #rev = "6e4f3026",
    path = "../blockstitch/crates/blockstitch-core"
}
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
uuid = { version = "1.24.0", features = ["v4"] }
rand = "0.10.2"
slotmap = { version = "1.1.1", features = ["serde"] }
tokio = { version = "1.53.0", features = ["sync"] }
spin_sleep = "1.3.3"
libc = "0.2"
evdev = "0.13.2"
x11rb = { version = "0.14", default-features = false, features = ["randr"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
bincode = { version = "2", features = ["serde"] }
memmap2 = "0.9"
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Memory",
    "Win32_Security",
] }
enigo = { git = "https://github.com/enigo-rs/enigo", rev = "a88d9b7", default-features = false }
self_update = { version = "1.3.0", default-features = false, features = ["reqwest", "rustls", "github"] }
http = "1"
core-graphics = "0.25.0"
core-foundation = "0.10.1"
foreign-types = "0.5"
starship-battery = { version = "0.11.1", default-features = false }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors"] }
