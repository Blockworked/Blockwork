[workspace]
members = ["src-tauri", "blockwork-core", "blockwork-ffi", "blockwork-linux-bridge"]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2024"

[workspace.dependencies]
tauri = { git = "https://github.com/EthanRStokes/tauri", rev = "e8458ba7" }
tracing = "0.1.44"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
uuid = { version = "1.24.0", features = ["v4"] }
rand = "0.10.2"
slotmap = { version = "1.1.1", features = ["serde"] }
tokio = { version = "1.53.0", features = ["sync"] }
spin_sleep = "1.3.3"
rfd = "0.17.2"
libc = "0.2"
evdev = "0.13.2"
x11rb = { version = "0.14", default-features = false }
bincode = { version = "2", features = ["serde"] }
memmap2 = "0.9"
windows-sys = { version = "0.61.2", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_Security",
] }
enigo = "0.6.1"
self_update = { version = "1.3.0", default-features = false, features = ["reqwest", "rustls"] }
http = "1"
core-graphics = "0.25.0"
core-foundation = "0.10.1"
foreign-types = "0.5"
starship-battery = { version = "0.11.1", default-features = false }
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
# Default features (async-io + blocking-api) give a synchronous
# `zbus::blocking` client with no extra tokio runtime, which is all the KWin
# scripting D-Bus calls in `window::linux::kwin_dbus` need.
zbus = "5.19.0"
# AT-SPI2 accessibility-tree queries/actions (see `accessibility/linux.rs`).
# Depend on `atspi-connection` directly with its defaults disabled: the
# umbrella crate's `connection` feature enables the connection crate's P2P
# defaults, whose eager peer discovery can wait indefinitely on a stalled
# desktop application. Plain bus proxies are sufficient for these queries.
atspi = { version = "0.30", default-features = false, features = ["proxies"] }
atspi-connection = { version = "0.14", default-features = false }
futures-lite = { version = "2", default-features = false, features = ["std"] }
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tauri-build = { git = "https://github.com/EthanRStokes/tauri", rev = "e8458ba7", features = [] }
tauri-runtime-cef = { git = "https://github.com/EthanRStokes/tauri", rev = "e8458ba7", default-features = false }
axum = { version = "0.8.9", features = ["ws"] }
tower-http = { version = "0.7.1", features = ["cors"] }

[patch.crates-io]
cef = { git = "https://github.com/EthanRStokes/cef-rs", rev = "b8fad92" }
cef-dll-sys = { git = "https://github.com/EthanRStokes/cef-rs", rev = "b8fad92" }

# Local integration override for the transparent CEF/OSR implementation used
# by the element-picker overlay. Replace this with a pinned fork revision once
# the sibling tauri change has been committed and published.
[patch."https://github.com/EthanRStokes/tauri"]
tauri = { path = "../tauri/crates/tauri" }
tauri-build = { path = "../tauri/crates/tauri-build" }
tauri-runtime-cef = { path = "../tauri/crates/tauri-runtime-cef" }
