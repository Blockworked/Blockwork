name: Checks

# Tests and clippy's deny-level lints on Linux. Clippy warnings are reported
# but don't fail the run.
on:
  push:
  workflow_dispatch:
    inputs:
      qml_probe:
        description: Run only native Mac QML checks for a focused diagnostic
        type: boolean
        default: false
      gc_limit:
        description: Qt GC time limit (0 matches the Mac app; 1 is the incremental control)
        type: choice
        default: '0'
        options: ['0', '1']

jobs:
  macos-core:
    if: ${{ !inputs.qml_probe }}
    name: macOS core and standalone FFI (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-core-${{ matrix.runner }}
      # Deliberately no Qt/app dependency to supply core features by unification:
      # the Geode embedder must also compile on its own.
      - run: cargo test -p blockwork-core -p blockwork-ffi
      - name: Test native macOS bundle validation
        run: python3 scripts/macos/test-verify-bundle.py

  test:
    if: ${{ !inputs.qml_probe }}
    name: Tests and clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Store submission regression checks
        shell: pwsh
        run: ./.github/tests/msstore-submission.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Release preparation regression checks
        run: python -m unittest discover -s .github/tests -p 'test_*.py'

      - name: Install Qt
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.10.3 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"
          qmake=$(find "$RUNNER_TEMP/Qt/6.10.3" -maxdepth 3 -path '*/bin/*' -name qmake | head -n 1)
          test -n "$qmake"
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$($qmake -query QT_INSTALL_LIBS)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: checks

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libudev-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxtst-dev \
            libwayland-dev \
            libclang-dev \
            libgl-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace --exclude blockwork-linux-bridge

  macos-qml-probe:
    if: ${{ inputs.qml_probe }}
    name: macOS QML (GC=${{ inputs.gc_limit }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      QV4_GC_TIMELIMIT: ${{ inputs.gc_limit }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Blockstitch QML
        run: |
          git init ../blockstitch
          git -C ../blockstitch remote add origin https://github.com/Blockworked/blockstitch.git
          git -C ../blockstitch fetch --depth 1 origin c6276edfae0f3187e796f3b385f27befb8d2602c
          git -C ../blockstitch checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Qt
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt mac desktop 6.10.3 clang_64 --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/6.10.3/macos/bin" >> "$GITHUB_PATH"
      - name: Run application QML tests
        run: python3 blockwork-qt/tests/run.py ../blockstitch
      - name: Preserve native QML crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qml-probe-crashes-${{ matrix.runner }}-gc${{ inputs.gc_limit }}
          path: target/macos-qml-crashes/
          if-no-files-found: ignore
          retention-days: 14
