name: Checks

# Tests and clippy's deny-level lints on Linux. Clippy warnings are reported
# but don't fail the run.
on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Tests and clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Store submission regression checks
        shell: pwsh
        run: ./.github/tests/msstore-submission.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.10.3 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"
          qmake=$(find "$RUNNER_TEMP/Qt/6.10.3" -maxdepth 3 -path '*/bin/*' -name qmake | head -n 1)
          test -n "$qmake"
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$($qmake -query QT_INSTALL_LIBS)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: checks

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libudev-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxtst-dev \
            libwayland-dev \
            libclang-dev \
            libgl-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Tests
        run: cargo test --workspace --exclude blockwork-linux-bridge
