name: Checks

# Tests and clippy on Linux (any warning fails), and core + FFI tests on macOS
# and Windows (Windows clippy warnings are reported only).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-core:
    name: macOS core and standalone FFI (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-core-${{ matrix.runner }}
      # Deliberately no Qt/app dependency to supply core features by unification:
      # the Geode embedder must also compile on its own.
      - run: cargo test -p blockwork-core -p blockwork-ffi
      - name: Test native macOS bundle validation
        run: python3 scripts/macos/test-verify-bundle.py

  windows-core:
    name: Windows core and FFI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-core
      # The Windows input backend and window code, which the Linux job never compiles.
      - run: cargo clippy -p blockwork-core -p blockwork-ffi --all-targets
      - run: cargo test -p blockwork-core -p blockwork-ffi

  test:
    name: Tests and clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Store submission regression checks
        shell: pwsh
        run: ./.github/tests/msstore-submission.ps1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Release preparation regression checks
        run: python -m unittest discover -s .github/tests -p 'test_*.py'

      - name: Install Qt
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt linux desktop 6.10.3 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"
          qmake=$(find "$RUNNER_TEMP/Qt/6.10.3" -maxdepth 3 -path '*/bin/*' -name qmake | head -n 1)
          test -n "$qmake"
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$($qmake -query QT_INSTALL_LIBS)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Formatting
        run: cargo fmt --all --check

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: checks

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libudev-dev \
            libxkbcommon-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxtst-dev \
            libwayland-dev \
            libclang-dev \
            libgl-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude blockwork-linux-bridge

      # blockwork-ffi's build regenerates the C header the Geometry Dash mod
      # compiles against; a stale committed copy fails here.
      - name: FFI header is current
        run: git diff --exit-code blockwork-ffi/include

      # The workspace build turns core's `system` feature on for everyone;
      # the website's editor core builds without it.
      - name: Web editor core without system features
        run: |
          cargo check -p blockwork-core --no-default-features
          cargo test -p blockwork-web

      # After the build, which stages the Lucide icons the QML tests import.
      - name: QML tests
        run: |
          scripts/fetch-blockstitch.sh ../blockstitch
          PATH="$(dirname "$QMAKE"):$PATH" python3 blockwork-qt/tests/run.py ../blockstitch
