name: Build Artifacts

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            qt_host: windows
            qt_arch: win64_msvc2022_64
            artifact_name: blockwork-windows-x86_64.zip
            installer_arch: x64compatible
            experimental: false

          - name: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_name: blockwork-windows-arm64.zip
            installer_arch: arm64
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            experimental: true

          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifact_name: blockwork-macos-arm64
            qt_host: mac
            qt_arch: clang_64
            experimental: false

          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: blockwork-macos-x86_64
            qt_host: mac
            qt_arch: clang_64
            experimental: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Blockstitch QML module
        shell: bash
        run: |
          # Match the Rust dependency used by the executable and its QML tests.
          git clone --depth 1 https://github.com/Blockworked/blockstitch.git ../blockstitch
          git -C ../blockstitch fetch --depth 1 origin 8ef2cc6c122710e18b97c565a6c7ef0e97f9f4da
          git -C ../blockstitch checkout --detach FETCH_HEAD

      # Official Qt builds where CXX-Qt's Qt download is missing or broken.
      - name: Set up Python
        if: matrix.qt_arch
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        if: matrix.qt_arch
        shell: bash
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt ${{ matrix.qt_host }} desktop 6.10.3 ${{ matrix.qt_arch }} --outputdir "$RUNNER_TEMP/Qt"
          qmake=$(find "$RUNNER_TEMP/Qt/6.10.3" -maxdepth 3 -path '*/bin/*' \( -name qmake -o -name qmake.exe \) | head -n 1)
          test -n "$qmake"
          if [[ "$RUNNER_OS" == Windows ]]; then qmake=$(cygpath -w "$qmake"); fi
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release, Windows)
        if: runner.os == 'Windows'
        env:
          # Allow transient registry DNS failures to recover before failing the build.
          CARGO_NET_RETRY: '10'
        run: cargo build --release --target ${{ matrix.target }} --workspace --exclude blockwork-linux-bridge

      - name: Stage Qt application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/deploy-qt-windows.ps1 -Target ${{ matrix.target }}
          Compress-Archive -Path "dist/windows-${{ matrix.target }}/*" -DestinationPath "${{ matrix.artifact_name }}" -Force

      - name: Upload artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Locate or install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }

      - name: Build installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $version = "${{ github.sha }}".Substring(0, 7)
          & $iscc "/DMyAppVersion=$version-dev" "/DTargetTriple=${{ matrix.target }}" "/DInstallerArch=${{ matrix.installer_arch }}" "/DOutputBaseFilename=blockwork-${{ matrix.name }}-setup" installer\blockwork.iss

      - name: Upload installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: blockwork-${{ matrix.name }}-setup.exe
          path: dist/blockwork-${{ matrix.name }}-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Build MSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $arch = if ("${{ matrix.target }}" -like "aarch64-*") { "arm64" } else { "x64" }
          ./scripts/build-msix.ps1 -Version $version -Target ${{ matrix.target }} -Arch $arch

      # An unsigned MSIX won't install locally, so sign a test copy with a throwaway cert.
      # The Store re-signs the release build.
      - name: Sign MSIX with test certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/sign-msix-test.ps1 -Msix dist/blockwork-${{ matrix.name }}.msix

      - name: Upload MSIX artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: blockwork-${{ matrix.name }}-msix-test
          path: |
            dist/blockwork-${{ matrix.name }}.msix
            dist/blockwork-msix-test.cer
          if-no-files-found: error
          retention-days: 14

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          # Newer Xcode clang lists __yield as a builtin but needs arm_acle.h to declare it (Qt's qyieldcpu.h).
          CXXFLAGS_aarch64_apple_darwin: -include arm_acle.h
        run: ./scripts/build-macos-bundle.sh ${{ matrix.target }}

      - name: Verify packaged executable starts
        if: runner.os == 'macOS'
        run: dist/Blockwork.app/Contents/MacOS/Blockwork --help

      - name: Run application QML tests
        if: runner.os == 'macOS'
        run: |
          export PATH="$(dirname "$QMAKE"):$PATH"
          python3 blockwork-qt/tests/run.py ../blockstitch

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Blockwork.app ${{ matrix.artifact_name }}.app.zip

      - name: Upload macOS app bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.app.zip
          path: ${{ matrix.artifact_name }}.app.zip
          if-no-files-found: error
          retention-days: 14

  linux-appimage:
    name: AppImage (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: blockwork-linux-x86_64
            linux_arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: blockwork-linux-arm64
            linux_arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Blockstitch QML module
        shell: bash
        run: |
          # Match the Rust dependency used by the executable and its QML tests.
          git clone --depth 1 https://github.com/Blockworked/blockstitch.git ../blockstitch
          git -C ../blockstitch fetch --depth 1 origin 8ef2cc6c122710e18b97c565a6c7ef0e97f9f4da
          git -C ../blockstitch checkout --detach FETCH_HEAD

      # Official Qt builds where CXX-Qt's Qt download is missing or broken.
      - name: Set up Python
        if: matrix.qt_arch
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        if: matrix.qt_arch
        shell: bash
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt ${{ matrix.qt_host }} desktop 6.10.3 ${{ matrix.qt_arch }} --outputdir "$RUNNER_TEMP/Qt"
          qmake=$(find "$RUNNER_TEMP/Qt/6.10.3" -maxdepth 3 -path '*/bin/*' \( -name qmake -o -name qmake.exe \) | head -n 1)
          test -n "$qmake"
          if [[ "$RUNNER_OS" == Windows ]]; then qmake=$(cygpath -w "$qmake"); fi
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libx11-xcb-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libclang-dev \
            lld \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} --workspace --exclude blockwork-linux-bridge

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          # linuxdeploy-plugin-qt only bundles xcb unless told otherwise.
          export EXTRA_PLATFORM_PLUGINS=libqwayland.so
          wget -q -O linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linux_arch }}.AppImage"
          wget -q -O linuxdeploy-plugin-appimage.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${{ matrix.linux_arch }}.AppImage"
          wget -q -O linuxdeploy-plugin-qt.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.linux_arch }}.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-appimage.AppImage linuxdeploy-plugin-qt.AppImage

          export LD_LIBRARY_PATH="$($QMAKE -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          export QML_SOURCES_PATHS="$PWD/blockwork-qt/qml:$PWD/../blockstitch/qml"

          RELEASE_DIR="target/${{ matrix.target }}/release"

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable "$RELEASE_DIR/blockwork" \
            --executable "$RELEASE_DIR/blockwork-daemon" \
            --desktop-file res/blockwork.desktop \
            --icon-file res/icons/blockwork.png \
            --plugin qt \
            --output appimage
          mv Blockwork*.AppImage ${{ matrix.artifact_name }}.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.AppImage
          path: ${{ matrix.artifact_name }}.AppImage
          if-no-files-found: error
          retention-days: 14

  linux-flatpak:
    name: Flatpak (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            artifact_name: blockwork-linux-x86_64

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: blockwork-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Blockstitch QML module
        shell: bash
        run: |
          # Match the Rust dependency used by the executable and its QML tests.
          git clone --depth 1 https://github.com/Blockworked/blockstitch.git ../blockstitch
          git -C ../blockstitch fetch --depth 1 origin 8ef2cc6c122710e18b97c565a6c7ef0e97f9f4da
          git -C ../blockstitch checkout --detach FETCH_HEAD

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.kde.Platform//6.10 org.kde.Sdk//6.10 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.flatpak.Builder

      - name: Generate offline Cargo sources
        run: |
          flatpak run --filesystem="$PWD" --command=flatpak-cargo-generator \
            org.flatpak.Builder -o packaging/flatpak/cargo-sources.json Cargo.lock

      - name: Build Flatpak
        # Offline sandbox build, no host cargo build needed.
        run: |
          manifest=packaging/flatpak/com.blockworked.Blockwork
          awk '
            /# BEGIN app-source/ {
              print
              print "      - type: dir"
              print "        path: ../.."
              print "        skip: [target, .git, .flatpak-builder, flatpak-build, flatpak-repo, packaging/flatpak]"
              skip = "app"
              next
            }
            /# END app-source/ { skip = ""; print; next }
            /# BEGIN blockstitch-source/ {
              print
              print "      - type: dir"
              print "        path: ../../../blockstitch"
              print "        dest: .flatpak-blockstitch"
              print "        skip: [target, .git, node_modules, dist]"
              skip = "blockstitch"
              next
            }
            /# END blockstitch-source/ { skip = ""; print; next }
            !skip
          ' "$manifest.yml" > "$manifest.local.yml"
          flatpak-builder --force-clean --user --default-branch=stable --repo=flatpak-repo flatpak-build "$manifest.local.yml"
          flatpak build-bundle flatpak-repo ${{ matrix.artifact_name }}.flatpak com.blockworked.Blockwork stable

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.flatpak
          path: ${{ matrix.artifact_name }}.flatpak
          if-no-files-found: error
          retention-days: 14
