name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 0.3.1)"
        required: true
        type: string
      release_name:
        description: "Release title (leave blank to use tag as title)"
        required: false
        type: string
        default: ""
      flight:
        description: "Microsoft Store package flight (name or ID). Missing names are created through the API; builds go only to that flight"
        required: false
        type: string
        default: ""
      flight_group_ids:
        description: "Comma-separated tester group IDs for a newly created Store flight (existing flights keep their groups)"
        required: false
        type: string
        default: ""

env:
  # The Qt every job installs; bump it here and in the other workflows.
  QT_VERSION: 6.12.0

jobs:
  plan:
    name: Plan builds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      # A flight run only needs the MSIX packages, which the Windows builds make
      - name: Pick platforms
        id: matrix
        env:
          FLIGHT: ${{ inputs.flight }}
        run: |
          matrix='[
            {"name": "windows-x86_64", "runner": "windows-latest", "target": "x86_64-pc-windows-msvc",
             "artifact_name": "blockwork-windows-x86_64.zip", "installer_arch": "x64compatible", "msix_arch": "x64",
             "qt_host": "windows", "qt_arch": "win64_msvc2022_64"},
            {"name": "windows-arm64", "runner": "windows-11-arm", "target": "aarch64-pc-windows-msvc",
             "artifact_name": "blockwork-windows-arm64.zip", "installer_arch": "arm64", "msix_arch": "arm64",
             "qt_host": "windows_arm64", "qt_arch": "win64_msvc2022_arm64"},
            {"name": "macos-arm64", "runner": "macos-latest", "target": "aarch64-apple-darwin",
             "artifact_name": "blockwork-macos-arm64", "qt_host": "mac", "qt_arch": "clang_64"},
            {"name": "macos-x86_64", "runner": "macos-15-intel", "target": "x86_64-apple-darwin",
             "artifact_name": "blockwork-macos-x86_64", "qt_host": "mac", "qt_arch": "clang_64"}
          ]'
          if [ -n "$FLIGHT" ]; then
            matrix=$(jq -c 'map(select(.msix_arch))' <<< "$matrix")
          fi
          echo "value={\"include\": $(jq -c . <<< "$matrix")}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [plan]
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Blockstitch QML module
        shell: bash
        run: |
          scripts/fetch-blockstitch.sh ../blockstitch

      # Official Qt builds where CXX-Qt's Qt download is missing or broken.
      - name: Set up Python
        if: matrix.qt_arch
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        if: matrix.qt_arch
        shell: bash
        run: |
          python -m pip install py7zr==1.1.3 "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          # A Qt mirror sometimes serves a broken archive, so try a few times.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/Qt"
            python -m aqt install-qt ${{ matrix.qt_host }} desktop ${{ env.QT_VERSION }} ${{ matrix.qt_arch }} --outputdir "$RUNNER_TEMP/Qt" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::Qt install failed (attempt $attempt), retrying"
            sleep 15
          done
          qmake=$(find "$RUNNER_TEMP/Qt/${{ env.QT_VERSION }}" -maxdepth 3 -path '*/bin/*' \( -name qmake -o -name qmake.exe \) | head -n 1)
          test -n "$qmake"
          if [[ "$RUNNER_OS" == Windows ]]; then qmake=$(cygpath -w "$qmake"); fi
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release, Windows)
        if: runner.os == 'Windows'
        env:
          # Allow transient registry DNS failures to recover before failing the build.
          CARGO_NET_RETRY: '10'
        run: cargo build --release --target ${{ matrix.target }} --workspace --exclude blockwork-linux-bridge

      - name: Stage Qt application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/deploy-qt-windows.ps1 -Target ${{ matrix.target }}
          ./scripts/package-portable-windows.ps1 -Target ${{ matrix.target }} -Output "${{ matrix.artifact_name }}"

      - name: Upload artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 90

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
          # Newer Xcode clang lists __yield as a builtin but needs arm_acle.h to declare it (Qt's qyieldcpu.h).
          CXXFLAGS_aarch64_apple_darwin: -include arm_acle.h
        run: ./scripts/build-macos-bundle.sh ${{ matrix.target }}

      - name: Verify packaged executable starts
        if: runner.os == 'macOS'
        run: dist/Blockwork.app/Contents/MacOS/Blockwork --help

      - name: Run application QML tests
        if: runner.os == 'macOS'
        run: |
          export PATH="$(dirname "$QMAKE"):$PATH"
          python3 blockwork-qt/tests/run.py ../blockstitch

      - name: Zip macOS app bundle
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Blockwork.app ${{ matrix.artifact_name }}.app.zip

      - name: Upload macOS app bundle
        id: upload-macos
        if: runner.os == 'macOS'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.app.zip
          path: ${{ matrix.artifact_name }}.app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Retry macOS app bundle upload
        if: runner.os == 'macOS' && steps.upload-macos.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.app.zip
          path: ${{ matrix.artifact_name }}.app.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 90

      - name: Locate or install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
          }

      - name: Determine installer version
        if: runner.os == 'Windows'
        id: installer_version
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.installer_version.outputs.value }}" "/DTargetTriple=${{ matrix.target }}" "/DInstallerArch=${{ matrix.installer_arch }}" "/DOutputBaseFilename=blockwork-${{ matrix.name }}-setup" installer\blockwork.iss

      - name: Upload installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: blockwork-${{ matrix.name }}-setup.exe
          path: dist/blockwork-${{ matrix.name }}-setup.exe
          if-no-files-found: error
          retention-days: 90

      - name: Build MSIX (Microsoft Store)
        if: matrix.msix_arch
        shell: pwsh
        run: ./scripts/build-msix.ps1 -Version "${{ steps.installer_version.outputs.value }}" -Target ${{ matrix.target }} -Arch ${{ matrix.msix_arch }}

      - name: Upload MSIX artifact
        if: matrix.msix_arch
        uses: actions/upload-artifact@v4
        with:
          name: blockwork-${{ matrix.name }}.msix
          path: dist/blockwork-${{ matrix.name }}.msix
          if-no-files-found: error
          retention-days: 90

  linux-appimage:
    name: AppImage (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    if: ${{ !inputs.flight }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported runner: the bundle needs the glibc it was
          # built against, so this sets the oldest distro it runs on.
          - name: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: blockwork-linux-x86_64
            linux_arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: blockwork-linux-arm64
            linux_arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add this release to the app listing
        # Software centers show the newest <release> in the metainfo as the version.
        shell: bash
        run: python3 packaging/linux/metainfo-release.py "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      - name: Checkout Blockstitch QML module
        shell: bash
        run: |
          scripts/fetch-blockstitch.sh ../blockstitch

      # Official Qt builds where CXX-Qt's Qt download is missing or broken.
      - name: Set up Python
        if: matrix.qt_arch
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        if: matrix.qt_arch
        shell: bash
        run: |
          python -m pip install py7zr==1.1.3 "aqtinstall @ git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7"
          # A Qt mirror sometimes serves a broken archive, so try a few times.
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/Qt"
            python -m aqt install-qt ${{ matrix.qt_host }} desktop ${{ env.QT_VERSION }} ${{ matrix.qt_arch }} --outputdir "$RUNNER_TEMP/Qt" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "::warning::Qt install failed (attempt $attempt), retrying"
            sleep 15
          done
          qmake=$(find "$RUNNER_TEMP/Qt/${{ env.QT_VERSION }}" -maxdepth 3 -path '*/bin/*' \( -name qmake -o -name qmake.exe \) | head -n 1)
          test -n "$qmake"
          if [[ "$RUNNER_OS" == Windows ]]; then qmake=$(cygpath -w "$qmake"); fi
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libx11-dev \
            libx11-xcb-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libclang-dev \
            lld \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-util1

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }} --workspace --exclude blockwork-linux-bridge

      - name: Build AppImage
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          # linuxdeploy-plugin-qt only bundles xcb unless told otherwise.
          export EXTRA_PLATFORM_PLUGINS=libqwayland.so
          wget -q -O linuxdeploy.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.linux_arch }}.AppImage"
          wget -q -O linuxdeploy-plugin-appimage.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${{ matrix.linux_arch }}.AppImage"
          wget -q -O linuxdeploy-plugin-qt.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.linux_arch }}.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-appimage.AppImage linuxdeploy-plugin-qt.AppImage

          export LD_LIBRARY_PATH="$($QMAKE -query QT_INSTALL_LIBS):${LD_LIBRARY_PATH:-}"
          export QML_SOURCES_PATHS="$PWD/blockwork-qt/qml:$PWD/../blockstitch/qml"

          RELEASE_DIR="target/${{ matrix.target }}/release"
          # The Wayland platform plugin loads its EGL integration separately.
          wayland_egl=wayland-graphics-integration-client/libqt-plugin-wayland-egl.so
          install -Dm755 "$("$QMAKE" -query QT_INSTALL_PLUGINS)/$wayland_egl" \
            "AppDir/usr/plugins/$wayland_egl"

          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable "$RELEASE_DIR/blockwork" \
            --executable "$RELEASE_DIR/blockwork-daemon" \
            --desktop-file res/blockwork.desktop \
            --icon-file res/icons/blockwork.png \
            --deploy-deps-only "AppDir/usr/plugins/$wayland_egl" \
            --plugin qt \
            --output appimage
          mv Blockwork*.AppImage ${{ matrix.artifact_name }}.AppImage

      # The same bundle as a .deb, for Debian and Ubuntu releases whose Qt is
      # older than 6.10 (Debian 13, Ubuntu 24.04 and 25.x).
      - name: Build .deb (bundled Qt)
        run: |
          sudo apt-get install -y --no-install-recommends dpkg-dev libegl1 libgl1 libx11-xcb1 libx11-6 \
            libcom-err2 libfontconfig1 libfreetype6 libfribidi0 libharfbuzz0b libwayland-client0 libxcb1
          deb=$(packaging/deb/build-deb.sh bundled deb-out AppDir | tail -n 1)
          mv "$deb" ${{ matrix.artifact_name }}.deb

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.AppImage
          path: ${{ matrix.artifact_name }}.AppImage
          if-no-files-found: error
          retention-days: 90

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.deb
          path: ${{ matrix.artifact_name }}.deb
          if-no-files-found: error
          retention-days: 90

  linux-deb:
    name: .deb (${{ matrix.distro }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: ${{ !inputs.flight }}
    container: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        # Releases whose own Qt is 6.10 or newer get a package built against it.
        distro: [ubuntu-26.04, ubuntu-26.10]
        arch: [amd64, arm64]
        include:
          - distro: ubuntu-26.04
            image: ubuntu:26.04
          - distro: ubuntu-26.10
            image: ubuntu:26.10
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake pkg-config \
            clang libclang-dev lld curl rustup dpkg-dev qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
            qt6-declarative-private-dev qt6-declarative-dev-tools libgtk-3-dev libdbus-1-dev libxkbcommon-dev \
            libwayland-dev python3
          rustup default stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: Add this release to the app listing
        # Software centers show the newest <release> in the metainfo as the version.
        shell: bash
        run: python3 packaging/linux/metainfo-release.py "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      - name: Build
        env:
          QMAKE: /usr/bin/qmake6
          CARGO_PROFILE_RELEASE_STRIP: 'true'
          # GNU ld's --as-needed drops Qt libraries cxx-qt's static archives need.
          RUSTFLAGS: -Clink-arg=-fuse-ld=lld
        run: cargo build --release --workspace --exclude blockwork-linux-bridge

      - name: Build .deb
        run: |
          deb=$(packaging/deb/build-deb.sh native deb-out | tail -n 1)
          mv "$deb" blockwork-${{ matrix.distro }}-${{ matrix.arch }}.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: blockwork-${{ matrix.distro }}-${{ matrix.arch }}.deb
          path: blockwork-${{ matrix.distro }}-${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 90

  linux-flatpak:
    name: Flatpak (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    if: ${{ !inputs.flight }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            artifact_name: blockwork-linux-x86_64

          - name: linux-arm64
            runner: ubuntu-24.04-arm
            artifact_name: blockwork-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add this release to the app listing
        # Software centers show the newest <release> in the metainfo as the version.
        shell: bash
        run: python3 packaging/linux/metainfo-release.py "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      - name: Checkout Blockstitch QML module
        shell: bash
        run: |
          scripts/fetch-blockstitch.sh ../blockstitch

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.kde.Platform//6.10 org.kde.Sdk//6.10 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.flatpak.Builder

      - name: Generate offline Cargo sources
        run: |
          flatpak run --filesystem="$PWD" --command=flatpak-cargo-generator \
            org.flatpak.Builder -o packaging/flatpak/cargo-sources.json Cargo.lock

      - name: Build Flatpak
        # Offline sandbox build, no host cargo build needed.
        run: |
          manifest=packaging/flatpak/com.blockworked.Blockwork
          awk '
            /# BEGIN app-source/ {
              print
              print "      - type: dir"
              print "        path: ../.."
              print "        skip: [target, .git, .flatpak-builder, flatpak-build, flatpak-repo, packaging/flatpak]"
              skip = "app"
              next
            }
            /# END app-source/ { skip = ""; print; next }
            /# BEGIN blockstitch-source/ {
              print
              print "      - type: dir"
              print "        path: ../../../blockstitch"
              print "        dest: .flatpak-blockstitch"
              print "        skip: [target, .git, node_modules, dist]"
              skip = "blockstitch"
              next
            }
            /# END blockstitch-source/ { skip = ""; print; next }
            !skip
          ' "$manifest.yml" > "$manifest.local.yml"
          flatpak-builder --force-clean --user --default-branch=stable --repo=flatpak-repo flatpak-build "$manifest.local.yml"
          # A bundle that names the repo and its key adds the repo as a remote
          # on install, so it updates with `flatpak update` from then on.
          bundle_args=(--runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo)
          if [ -s packaging/flatpak/blockwork.gpg ]; then
            bundle_args+=(--repo-url=https://flatpak.blockworked.com/repo/ --gpg-keys=packaging/flatpak/blockwork.gpg)
          fi
          flatpak build-bundle "${bundle_args[@]}" flatpak-repo ${{ matrix.artifact_name }}.flatpak com.blockworked.Blockwork stable

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}.flatpak
          path: ${{ matrix.artifact_name }}.flatpak
          if-no-files-found: error
          retention-days: 90

  linux-arch:
    name: Arch package (${{ matrix.arch }})
    if: ${{ !inputs.flight }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Arch Linux ARM image
        if: matrix.arch == 'aarch64'
        run: |
          gnupg=$(mktemp -d)
          rootfs="$RUNNER_TEMP/ArchLinuxARM-aarch64-latest.tar.gz"
          mirror=https://ca.us.mirror.archlinuxarm.org
          curl -fsSL --retry 3 "$mirror/os/${rootfs##*/}" -o "$rootfs"
          curl -fsSL --retry 3 "$mirror/os/${rootfs##*/}.sig" -o "$rootfs.sig"
          curl -fsSL --retry 3 https://raw.githubusercontent.com/archlinuxarm/PKGBUILDs/master/core/archlinuxarm-keyring/archlinuxarm.gpg -o "$gnupg/archlinuxarm.gpg"
          gpg --homedir "$gnupg" --batch --import "$gnupg/archlinuxarm.gpg"
          gpg --homedir "$gnupg" --batch --export 68B3537F39A313B3E574D06777193F152BDBE6A6 > "$gnupg/rootfs.gpg"
          gpgv --keyring "$gnupg/rootfs.gpg" "$rootfs.sig" "$rootfs"
          docker import "$rootfs" blockwork-archlinuxarm
          rm -f "$rootfs" "$rootfs.sig"
          echo "ARCH_IMAGE=blockwork-archlinuxarm" >> "$GITHUB_ENV"

      - name: Build and check the Arch package
        env:
          ARCH_JOBS: 2
        run: |
          packaging/aur/render.sh "$TAG" dist/arch --source-only
          docker run --rm -e ARCH -e ARCH_JOBS -v "$PWD/dist/arch:/build" -w /build "${ARCH_IMAGE:-archlinux:latest}" bash -euc '
            pacman-key --init
            if [[ $ARCH == aarch64 ]]; then
              pacman-key --populate archlinuxarm
              printf "Server = https://ca.us.mirror.archlinuxarm.org/\$arch/\$repo\n" > /etc/pacman.d/mirrorlist
            else
              pacman-key --populate archlinux
            fi
            pacman -Syu --noconfirm --needed base-devel git rust cmake clang lld pkgconf zstd \
              qt6-base qt6-declarative qt6-svg hicolor-icon-theme gcc-libs dbus libxkbcommon wayland gtk3
            # Arch Linux ARM defaults to .pkg.tar.xz.
            printf "\nPKGEXT=.pkg.tar.zst\n" >> /etc/makepkg.conf
            useradd -m builder
            chown -R builder /build/blockwork
            cd blockwork
            runuser -u builder -- env MAKEFLAGS="-j$ARCH_JOBS" CARGO_BUILD_JOBS="$ARCH_JOBS" makepkg --noconfirm
            package=(blockwork-[0-9]*.pkg.tar.zst)
            test "${#package[@]}" -eq 1
            pacman -U --noconfirm "${package[0]}"
            test -x /usr/bin/blockwork
            test -x /usr/lib/blockwork/blockwork-daemon
            ui_libs=$(ldd /usr/bin/blockwork)
            daemon_libs=$(ldd /usr/lib/blockwork/blockwork-daemon)
            grep -q "libQt6.* => /usr/lib/" <<< "$ui_libs"
            if grep -q "not found" <<< "$(printf "%s\n%s" "$ui_libs" "$daemon_libs")"; then
              printf "%s\n%s\n" "$ui_libs" "$daemon_libs"
              exit 1
            fi
            cp "${package[0]}" "/build/blockwork-arch-$ARCH.pkg.tar.zst"
          '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: blockwork-arch-${{ matrix.arch }}.pkg.tar.zst
          path: dist/arch/blockwork-arch-${{ matrix.arch }}.pkg.tar.zst
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, linux-appimage, linux-deb, linux-flatpak, linux-arch]
    outputs:
      has_macos: ${{ steps.notes.outputs.has_macos }}
    # A flight build goes to the Store flight only, so no GitHub release (and no Chocolatey, Homebrew or winget)
    if: ${{ success() && !inputs.flight }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release name
        id: release_name
        run: |
          NAME="${{ inputs.release_name }}"
          if [ -z "$NAME" ]; then
            NAME="${{ steps.tag.outputs.value }}"
          fi
          echo "value=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: ./release-artifacts

      - name: Validate artifacts and build release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          python3 .github/prepare-release.py --tag "$TAG" --artifacts release-artifacts --output RELEASE_BODY.md
          if [ -s release-artifacts/blockwork-macos-arm64.app.zip ]; then
            echo "has_macos=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.release_name.outputs.value }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: ./release-artifacts/*
          body_path: RELEASE_BODY.md

  chocolatey:
    name: Chocolatey
    needs: [release]
    uses: ./.github/workflows/chocolatey.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  homebrew:
    name: Homebrew
    needs: [release]
    if: ${{ needs.release.outputs.has_macos == 'true' }}
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  flatpak-repo:
    name: Flatpak repo
    needs: [release]
    uses: ./.github/workflows/flatpak-repo.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  copr:
    name: COPR
    needs: [release]
    uses: ./.github/workflows/copr.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  aur:
    name: AUR
    needs: [release]
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  winget:
    name: Publish to winget
    needs: [release]
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    secrets: inherit

  msstore:
    name: Submit to Microsoft Store
    runs-on: windows-latest
    needs: [build, release]
    if: ${{ always() && needs.build.result == 'success' && (needs.release.result == 'success' || inputs.flight) }}
    env:
      MSSTORE_FLIGHT: ${{ inputs.flight }}
      MSSTORE_FLIGHT_GROUP_IDS: ${{ inputs.flight_group_ids }}
      MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      MSSTORE_APP_ID: ${{ vars.MSSTORE_APP_ID || secrets.MSSTORE_APP_ID }}

    steps:
      # Skipped until the Partner Center credentials are set, like winget
      - name: Check Store credentials
        id: creds
        shell: pwsh
        run: |
          $missing = @("MSSTORE_TENANT_ID", "MSSTORE_CLIENT_ID", "MSSTORE_CLIENT_SECRET", "MSSTORE_APP_ID") |
            Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            Write-Host "Skipping Store submission, not set: $($missing -join ', ')"
            echo "ready=false" >> $env:GITHUB_OUTPUT
          } else {
            echo "ready=true" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Download MSIX packages
        if: steps.creds.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: blockwork-windows-*.msix
          merge-multiple: true
          path: dist

      # The Store signs the package and runs certification after this
      - name: Submit to Partner Center
        if: steps.creds.outputs.ready == 'true'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem dist/*.msix | ForEach-Object FullName)
          if (-not ($packages -match 'x86_64')) { throw "The x64 MSIX is missing" }
          if (-not ($packages -match 'arm64')) { throw "The arm64 MSIX is missing" }
          ./scripts/submit-msstore.ps1 -Msix $packages -Flight "$env:MSSTORE_FLIGHT" -FlightGroupIds @($env:MSSTORE_FLIGHT_GROUP_IDS)
