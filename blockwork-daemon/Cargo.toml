[package]
name = "blockwork-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
blockwork-app = { path = "../blockwork-app" }
blockwork-protocol = { path = "../blockwork-protocol" }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
dirs.workspace = true
tao = "0.37"
png = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.25", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "tokio"] }
