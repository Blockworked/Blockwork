[package]
name = "blockwork-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blockstitch-core.workspace = true
blockwork-core = { path = "../blockwork-core" }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
chrono.workspace = true
dirs.workspace = true
base64.workspace = true
sha2 = "0.10.9"

[features]
# Backend::for_tests, for other crates' tests.
test-support = []

[dev-dependencies]
# Only the icon list, to check the names the editor asks for.
lucide-qt = { git = "https://github.com/Blockworked/lucide-qt", tag = "v0.1.0" }
# The website's editor, replayed against this crate's commands.
blockwork-web = { path = "../blockwork-web" }
blockstitch-ffi.workspace = true
