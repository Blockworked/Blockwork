[package]
name = "blockwork-ffi"
version.workspace = true
# Pinned to 2021 (not `edition.workspace = true`) rather than 2024: cbindgen
# 0.27's parser doesn't recognize edition 2024's `#[unsafe(no_mangle)]` form
# and silently emits an empty header - plain `#[no_mangle]` (legal, just
# non-default, on 2021) sidesteps that instead of chasing cbindgen versions.
edition = "2021"

[lib]
name = "blockwork_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
blockwork-core = { path = "../blockwork-core", default-features = false }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
cbindgen = "0.27"
