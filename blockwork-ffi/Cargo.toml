[package]
name = "blockwork-ffi"
version.workspace = true
# 2021, not the workspace's 2024: cbindgen 0.27 skips `#[unsafe(no_mangle)]`
# and would write an empty header.
edition = "2021"

[lib]
name = "blockwork_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
blockwork-core = { path = "../blockwork-core", default-features = false, features = ["system"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
cbindgen = "0.27"
