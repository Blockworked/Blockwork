<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Blockwork</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('blockstitch-theme') || localStorage.getItem('blockwork-theme') || localStorage.getItem('macros-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <!-- Theme background before any CSS loads (matches --blockstitch-bg). -->
  <style>
    html { background: #1c1c1e; }
    html[data-theme="light"] { background: #f2f2f5; }
  </style>
</head>
<body>
<div id="app"></div>
<div id="dd-portal"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
