[package]
name = "blockwork-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "blockwork_core"

[features]
default = ["ipc", "updater", "onnx", "gpu"]
# Loopback TCP control server; not needed by an embedder (e.g. via
# blockwork-ffi) that calls into this crate directly and in-process.
ipc = ["tokio/rt", "tokio/rt-multi-thread", "tokio/macros", "tokio/net", "tokio/io-util", "tokio/time"]
# Self-update mechanism for the standalone desktop app; inappropriate for a
# copy of this crate embedded inside another process (e.g. a game).
updater = ["dep:self_update", "dep:http"]
# Built-in object detection models (see src/detect/onnx.rs). Pure Rust, so
# offline and Flatpak builds need no native runtime.
onnx = ["dep:tract-onnx"]
# Runs models on Apple Metal on macOS, or CUDA on Linux/Windows. Machines
# without a usable GPU/runtime fall back to the CPU.
gpu = ["onnx", "dep:tract-cuda", "dep:tract-metal"]

[dependencies]
blockwork-model = { path = "../blockwork-model" }
blockstitch-core.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
uuid.workspace = true
rand.workspace = true
tokio.workspace = true
spin_sleep.workspace = true
bincode.workspace = true
starship-battery.workspace = true
arboard.workspace = true
chrono.workspace = true
# HTTP blocks (see src/http.rs).
ureq.workspace = true
# Screen images: captures, block images as PNG data: URIs (see src/screen/).
png = "0.18"
base64.workspace = true
# Regex text operators.
regex.workspace = true
tract-onnx = { version = "0.23.9", optional = true }
# Pins downloaded model files.
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev.workspace = true
# Read-only cursor-position query via XWayland (see backend/x11_cursor.rs) -
# not the removed XTest emission backend; core X11 protocol only.
x11rb.workspace = true
# Keep Enigo on the portal; its X11 backend takes priority even on Wayland.
enigo = { workspace = true, features = ["libei", "smol"] }
wayland-client.workspace = true
wayland-protocols.workspace = true
# Desktop notifications over the session bus (see src/notify.rs).
zbus.workspace = true
# A runtime for zbus tasks on plain threads (see src/dbus.rs).
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time"] }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tract-cuda = { version = "=0.23.9", optional = true }

[target.'cfg(windows)'.dependencies]
enigo.workspace = true
windows-sys.workspace = true
self_update = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSEvent", "NSGraphicsContext", "NSScreen", "libc", "objc2-core-graphics"] }
tract-metal = { version = "=0.23.9", optional = true }
core-graphics.workspace = true
core-foundation.workspace = true
foreign-types.workspace = true
# Secrets in the Keychain (see src/secrets.rs).
security-framework.workspace = true
self_update = { workspace = true, optional = true }
http = { workspace = true, optional = true }
